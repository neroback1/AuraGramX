<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="480" viewBox="0 0 1280 480" role="img" aria-labelledby="title desc">
  <title id="title">AuraGramX — Your Telegram, refined.</title>
  <desc id="desc">Electric blue AuraGramX plane and X logo on a dark navy background. An enhanced Telegram client for Android, by NERO / MAHDI.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#070d18"/><stop offset="1" stop-color="#101e39"/></linearGradient>
    <linearGradient id="blue" x1="0" y1="1" x2="1" y2="0"><stop stop-color="#1954ff"/><stop offset=".6" stop-color="#1299ff"/><stop offset="1" stop-color="#64f3ff"/></linearGradient>
    <radialGradient id="aura"><stop stop-color="#246bff" stop-opacity=".25"/><stop offset="1" stop-color="#246bff" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="1280" height="480" rx="24" fill="url(#bg)"/>
  <circle cx="1010" cy="220" r="360" fill="url(#aura)"/>
  <g fill="none" stroke="#85baff" stroke-opacity=".08">
    <circle cx="1020" cy="235" r="170"/><circle cx="1020" cy="235" r="215"/><circle cx="1020" cy="235" r="260"/>
    <path d="M0 410H1280M0 411L780 0M180 480L1000 0M470 480L1250 0"/>
  </g>
  <rect x="64" y="58" width="267" height="34" rx="17" fill="#132d4f" stroke="#274d78"/>
  <circle cx="83" cy="75" r="4" fill="#47dbff"/>
  <text x="98" y="80" fill="#9bdcff" font-family="Arial, sans-serif" font-size="12" letter-spacing="1.8">INDEPENDENT TELEGRAM CLIENT</text>
  <text x="62" y="189" fill="#f1f6ff" font-family="Arial, sans-serif" font-size="80" font-weight="700" letter-spacing="-3">Aura<tspan fill="url(#blue)">GramX</tspan></text>
  <text x="66" y="250" fill="#d7e6fb" font-family="Arial, sans-serif" font-size="31">Your Telegram, refined.</text>
  <text x="67" y="292" fill="#91a5c3" font-family="Arial, sans-serif" font-size="17">Message history. Media tools. A look that feels yours.</text>
  <g font-family="Arial, sans-serif" font-size="13" fill="#c5dcff">
    <rect x="66" y="326" width="127" height="36" rx="18" fill="#162842" stroke="#294363"/>
