    <rect x="204" y="326" width="143" height="36" rx="18" fill="#162842" stroke="#294363"/>
    <text x="226" y="349">Universal APK</text>
    <rect x="358" y="326" width="165" height="36" rx="18" fill="#162842" stroke="#294363"/>
    <text x="379" y="349">Arabic + English</text>
  </g>
  <text x="67" y="430" fill="#6e87ab" font-family="Arial, sans-serif" font-size="12" letter-spacing="2">CRAFTED BY NERO / MAHDI</text>
  <g transform="translate(875 91) scale(12)" fill="url(#blue)">
    <path d="M2 13 21.5 2 16.4 13 14.5 13.5 8.5 19.5 16.1 7.1 7.6 13Z M3 22 11.8 13.3 9.3 17.7Z"/>
    <path d="M15.3 16H17.2L18.8 18 20.4 16H22.3L19.8 19 22.3 22H20.4L18.8 20 17.2 22H15.3L17.8 19Z"/>
